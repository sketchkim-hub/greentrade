<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://greentrade.co.kr/quote-thanks.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230f4526'/%3E%3Ccircle cx='12' cy='12' r='7' fill='none' stroke='%23c8a84b' stroke-width='1.8'/%3E%3Cpath d='M5 12h14M12 5c-2 2.2-3 4.5-3 7s1 4.8 3 7M12 5c2 2.2 3 4.5 3 7s-1 4.8-3 7' fill='none' stroke='%23c8a84b' stroke-width='1.8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Bebas+Neue&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --green: #1a6b3c;
  --green-dark: #0f4526;
  --green-pale: #e8f5ee;
  --gold: #c8a84b;
  --gold-light: #e8c96a;
  --dark: #0e1a14;
  --gray: #5a6b61;
  --white: #ffffff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--dark);
  background: var(--white);
  min-height: 100vh;
  word-break: keep-all;
}
nav {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(14,26,20,0.96);
  padding: 0 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  border-bottom: 1px solid rgba(200,168,75,0.2);
}
.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo-icon {
  width: 36px; height: 36px; background: var(--gold); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
}
.nav-logo-icon svg { width: 22px; height: 22px; }
.nav-logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; color: var(--white); }
.nav-logo-sub { font-size: 10px; color: var(--gold); letter-spacing: 1px; line-height: 1; }
.nav-links { display: flex; gap: 24px; list-style: none; align-items: center; }
.nav-links a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px; }
.nav-links a:hover { color: var(--gold); }
.nav-cta {
  background: var(--gold); color: var(--dark) !important; padding: 8px 16px; border-radius: 4px;
  font-weight: 700 !important; white-space: nowrap;
}
main {
  padding: 56px 20px 80px;
  background:
    radial-gradient(ellipse 55% 45% at 92% 0%, rgba(200,168,75,0.16) 0%, transparent 62%),
    linear-gradient(180deg, #f7fbf8, #ffffff 40%);
}
.card {
  max-width: 640px;
  margin: 0 auto;
  background: var(--white);
  border: 1px solid rgba(26,107,60,0.15);
  border-radius: 16px;
  padding: 40px 32px;
  box-shadow: 0 8px 32px rgba(26,107,60,0.06);
}
.mark {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--green-pale); color: var(--green-dark);
  display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
}
.mark svg { width: 28px; height: 28px; }
h1 { font-size: 28px; line-height: 1.35; margin-bottom: 12px; color: var(--green-dark); }
p { font-size: 15px; line-height: 1.75; color: #3d5248; margin-bottom: 12px; }
.note {
  background: var(--green-pale);
  border-radius: 10px;
  padding: 14px 16px;
  margin: 18px 0 22px;
}
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 48px; padding: 12px 18px; border-radius: 8px;
  text-decoration: none; font-weight: 700; font-size: 15px;
}
.btn-primary { background: var(--gold); color: var(--dark); }
.btn-ghost { background: transparent; color: var(--green-dark); border: 1px solid rgba(26,107,60,0.3); }
footer { padding: 28px 5% 36px; background: #080f0c; color: #c5d0c9; font-size: 13px; }
footer a { color: var(--gold-light); }
.nav-hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; padding: 4px; cursor: pointer; }
.nav-hamburger span { width: 22px; height: 2px; background: #fff; display: block; }
@media (max-width: 900px) {
  .nav-links { display: none; }
  .nav-hamburger { display: flex; }
  .nav-links.is-open {
    display: flex; flex-direction: column; position: fixed; top: 64px; left: 0; right: 0;
    background: rgba(14,26,20,0.98); padding: 20px 5%; gap: 16px; z-index: 20;
  }
}
@media (max-width: 480px) {
  .card { padding: 28px 18px; }
  h1 { font-size: 24px; }
}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0f4526" stroke-width="2.2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M2 12h20M12 2c-2.5 3-4 6.5-4 10s1.5 7 4 10M12 2c2.5 3 4 6.5 4 10s-1.5 7-4 10"/>
      </svg>
    </div>
    <div>
      <div class="nav-logo-text">GreenTrade</div>
      <div class="nav-logo-sub">greentrade.co.kr</div>
    </div>
  </a>
  <ul class="nav-links">
    <li><a href="index.html#services">서비스</a></li>
    <li><a href="index.html#process">진행절차</a></li>
    <li><a href="index.html#contact">문의</a></li>
    <li><a href="quote.html" class="nav-cta">무료 견적 요청</a></li>
  </ul>
  <button class="nav-hamburger" type="button" aria-label="메뉴" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>
<main>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
    <h1>견적 요청이 접수되었습니다</h1>
    <p>입력하신 이메일로 영업일에 회신드립니다. 급한 문의는 <a href="mailto:kimsketch@naver.com">kimsketch@naver.com</a>으로 보내 주세요.</p>
    <div class="note">
      <p style="margin:0">이 접수는 견적 요청입니다. 금액이 확정되지 않았고, 결제되지도 않습니다. 공급가, 환율, 운임, 관세를 확인한 뒤 견적으로 따로 안내드립니다.</p>
    </div>
    <div class="actions">
      <a class="btn btn-primary" href="index.html">홈으로</a>
      <a class="btn btn-ghost" href="quote.html">다른 품목 요청하기</a>
    </div>
  </div>
</main>
<footer>
  <p>© 2026 그린인터앤엠 (GreenTrade). <a href="index.html">greentrade.co.kr</a></p>
</footer>
<script>
document.querySelector('.nav-hamburger').addEventListener('click', () => {
  const links = document.querySelector('.nav-links');
  const open = links.classList.toggle('is-open');
  document.querySelector('.nav-hamburger').setAttribute('aria-expanded', open ? 'true' : 'false');
});
</script>
</body>
</html>
